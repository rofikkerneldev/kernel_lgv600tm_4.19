name: LG SM8250 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev \
          libncurses5-dev zip python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
         

      - name: Fetch Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Detect Kernel Version
        id: info
        run: |
          V=$(grep "^VERSION =" Makefile | awk '{print $3}')
          P=$(grep "^PATCHLEVEL =" Makefile | awk '{print $3}')
          S=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "KVER=$V.$P.$S" >> $GITHUB_OUTPUT

      - name: Build Kernel
        env:
          PATH: /usr/bin:${{ github.workspace }}/toolchain/bin:/bin
        run: |
          # 1. Configuration
          DEFCONFIG="vendor/kona-perf_defconfig"
          CUSTOM_NAME="-rofikkerneltest" 
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          wget https://raw.githubusercontent.com/WireGuard/android_kernel_wireguard/refs/heads/master/patch-kernel.sh
          chmod +x patch-kernel.sh
          bash ./patch-kernel.sh .
          # 2. Initialize Config
          make O=out $DEFCONFIG
          
          # 3. Compile Kernel and DTBs
          # Note: We added 'dtbs' to the targets
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               CROSS_COMPILE=$CROSS_COMPILE \
               CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
               LOCALVERSION=$CUSTOM_NAME \
               Image.gz dtbs

          # 4. Create Image.gz-dtb
          # This joins the Image.gz and all generated DTBs into one file
          cat out/arch/arm64/boot/Image.gz $(find out/arch/arm64/boot/dts/vendor -name "*.dtb") > out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-v${{ steps.info.outputs.KVER }}-Custom
          path: out/arch/arm64/boot/Image.gz-dtb
          
